[project]
name = "langgraph-agentic-rag"
version = "0.1.0"
description = "Agentic RAG application built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LangChain
    "langchain>=0.3.25",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.23",
    "langchain-community>=0.3.25",
    "langchain-text-splitters>=0.3.8",
    
    # Vector Store
    "langchain-chroma>=0.2.4",
    
    # Web Search
    "langchain-tavily>=0.2.3",
    
    # Graph Framework
    "langgraph>=0.5.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "tiktoken>=0.9.0",
    
    # Testing
    "pytest>=8.4.1",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
