[project]
name = "rag-pipeline-visualizer"
version = "1.0.0"
description = "Interactive RAG Embedding Visualizer - Visualize text embeddings and understand how RAG systems work"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["rag", "embeddings", "visualization", "nlp", "vector-database", "chromadb", "streamlit"]

dependencies = [
    "streamlit>=1.28.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.15",
    "plotly>=5.17.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.4",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
